<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS-FREE-PDF | Scan to PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="text-left mb-4">
            <a href="index.html" class="text-blue-500 hover:underline text-sm">← Back to Dashboard</a>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Scan to PDF</h1>
        <p class="text-gray-500 mb-8">Take photos of your documents. We will package them into a single PDF.</p>

        <!-- Input Controls -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <!-- Mobile Camera Trigger -->
            <button id="cameraBtn" class="bg-teal-100 hover:bg-teal-200 text-teal-800 font-bold py-4 rounded-lg border-2 border-teal-300 transition flex flex-col items-center">
                <span class="text-2xl mb-1">📷</span>
                <span>Open Camera</span>
            </button>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" multiple/>

            <!-- Gallery / Desktop Fallback Trigger -->
            <button id="galleryBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-4 rounded-lg border-2 border-gray-300 transition flex flex-col items-center">
                <span class="text-2xl mb-1">🖼️</span>
                <span>Upload Image</span>
            </button>
            <input type="file" id="galleryInput" accept="image/jpeg, image/png" class="hidden" multiple/>
        </div>

        <!-- File Preview List -->
        <ul id="fileList" class="text-left text-sm mb-6 space-y-2 hidden">
            <!-- Dynamically populated by JS -->
        </ul>

        <!-- Action Button with Loading State -->
        <button id="buildBtn" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded transition opacity-50 cursor-not-allowed flex items-center justify-center" disabled>
            <svg id="loadingSpinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="btnText">Build PDF</span>
        </button>

        <p id="statusText" class="mt-4 text-sm text-gray-600"></p>
    </div>

    <script src="js/scan.js"></script>
</body>
</html>
