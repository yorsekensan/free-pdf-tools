<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS-FREE-PDF | Enhanced Rotate PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-4xl w-full bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="text-left mb-4">
            <a href="index.html" class="text-blue-500 hover:underline text-sm">← Back to Dashboard</a>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Enhanced Rotate PDF</h1>
        <p class="text-gray-500 mb-8">Hover over a page to rotate it individually, then save.</p>

        <!-- Upload Zone -->
        <div id="uploadZone" class="border-4 border-dashed border-gray-300 rounded-lg p-10 mb-6 bg-gray-50 cursor-pointer hover:bg-gray-100 transition">
            <div class="text-gray-400 text-4xl mb-3">↻</div>
            <p class="text-gray-600 font-semibold">Click or drag a PDF here to load thumbnails</p>
            <input type="file" id="fileInput" accept="application/pdf" class="hidden"/>
        </div>

        <!-- Thumbnail Grid -->
        <div id="thumbnailGrid" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-6 hidden">
            <!-- Canvases injected here via JS -->
        </div>

        <!-- Action Button -->
        <button id="saveBtn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded transition hidden" disabled>
            Save Rotations & Download
        </button>

        <p id="statusText" class="mt-4 text-sm text-gray-600"></p>
    </div>

    <script src="js/rotate.js"></script>
</body>
</html>
