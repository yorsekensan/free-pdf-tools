<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS-FREE-PDF | PDF to JPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pdf.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="text-left mb-4">
            <a href="index.html" class="text-blue-500 hover:underline text-sm">← Back to Dashboard</a>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">PDF to JPG</h1>
        <p class="text-gray-500 mb-8">Convert a specific PDF page into an image file entirely in your browser.</p>

        <!-- File Upload -->
        <div class="border-4 border-dashed border-gray-300 rounded-lg p-10 mb-6 bg-gray-50">
            <input type="file" id="fileInput" accept="application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100"/>
            <p id="pageCountDisplay" class="mt-2 text-sm text-gray-400 hidden">Document has <span id="pageCount" class="font-bold">0</span> pages.</p>
        </div>

        <!-- Page Selection -->
        <div class="text-left mb-6">
            <label class="block text-sm font-bold mb-1">Page to Convert</label>
            <input type="number" id="pageNumberInput" min="1" placeholder="e.g., 1" class="w-full border rounded px-3 py-2 disabled:bg-gray-100 disabled:cursor-not-allowed" disabled>
        </div>

        <!-- Action Button -->
        <button id="convertBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded transition opacity-50 cursor-not-allowed" disabled>
            Convert to JPG & Download
        </button>

        <p id="statusText" class="mt-4 text-sm text-gray-600"></p>
    </div>

    <!-- Hidden Canvas for Rendering -->
    <canvas id="pdfCanvas" class="hidden"></canvas>

    <script src="js/pdf-to-jpg.js"></script>
</body>
</html>
