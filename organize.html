<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS-FREE-PDF | Organize PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="text-left mb-4">
            <a href="index.html" class="text-blue-500 hover:underline text-sm">← Back to Dashboard</a>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Organize PDF</h1>
        <p class="text-gray-500 mb-8">Type the exact order of pages you want. Exclude pages to delete them.</p>

        <!-- File Upload -->
        <div class="border-4 border-dashed border-gray-300 rounded-lg p-10 mb-6 bg-gray-50">
            <input type="file" id="fileInput" accept="application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"/>
            <p id="pageCountDisplay" class="mt-2 text-sm text-gray-400 hidden">Document loaded with <span id="pageCount" class="font-bold">0</span> pages.</p>
        </div>

        <!-- Sequence Input -->
        <div class="text-left mb-6">
            <label class="block text-sm font-bold mb-1">New Page Sequence (comma separated)</label>
            <input type="text" id="sequenceInput" placeholder="e.g., 4, 1, 2, 2" class="w-full border rounded px-3 py-2 disabled:bg-gray-100 disabled:cursor-not-allowed" disabled>
            <p class="text-xs text-gray-500 mt-1">Example: "4, 1, 2, 2" moves page 4 to the front, keeps 1 and 2, and duplicates page 2. Page 3 is deleted.</p>
        </div>

        <!-- Action Button -->
        <button id="organizeBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded transition opacity-50 cursor-not-allowed" disabled>
            Rebuild & Download PDF
        </button>

        <p id="statusText" class="mt-4 text-sm text-gray-600"></p>
    </div>

    <script src="js/organize.js"></script>
</body>
</html>
