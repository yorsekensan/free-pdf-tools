<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS-FREE-PDF | Split PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="text-left mb-4">
            <a href="index.html" class="text-blue-500 hover:underline text-sm">← Back to Dashboard</a>
        </div>
        
        <h1 class="text-3xl font-bold mb-2">Split PDF</h1>
        <p class="text-gray-500 mb-8">Extract specific pages into a new document. 100% locally.</p>

        <!-- File Upload -->
        <div class="border-4 border-dashed border-gray-300 rounded-lg p-10 mb-6 bg-gray-50">
            <input type="file" id="fileInput" accept="application/pdf" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100"/>
        </div>

        <!-- Range Inputs -->
        <div class="flex space-x-4 mb-6">
            <div class="w-1/2 text-left">
                <label class="block text-sm font-bold mb-1">Start Page</label>
                <input type="number" id="startPage" min="1" placeholder="e.g., 1" class="w-full border rounded px-3 py-2">
            </div>
            <div class="w-1/2 text-left">
                <label class="block text-sm font-bold mb-1">End Page</label>
                <input type="number" id="endPage" min="1" placeholder="e.g., 3" class="w-full border rounded px-3 py-2">
            </div>
        </div>

        <!-- Action Button -->
        <button id="splitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded transition opacity-50 cursor-not-allowed" disabled>
            Split & Download PDF
        </button>

        <p id="statusText" class="mt-4 text-sm text-gray-600"></p>
    </div>

    <script src="js/split.js"></script>
</body>
</html>
