<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YS-FREE-PDF | Secure PDF Merger</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- pdf-lib for client-side PDF manipulation -->
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white p-8 rounded-xl shadow-lg text-center">
        <h1 class="text-3xl font-bold mb-2">YS-FREE-PDF</h1>
        <p class="text-gray-500 mb-8">100% Private Client-Side Editor. Files never leave your device.</p>

        <!-- File Upload -->
        <div class="border-4 border-dashed border-gray-300 rounded-lg p-10 mb-6 bg-gray-50">
            <input type="file" id="fileInput" accept="application/pdf" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            <p class="mt-2 text-sm text-gray-400">Select multiple PDFs to merge</p>
        </div>

        <!-- Action Button -->
        <button id="mergeBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded transition opacity-50 cursor-not-allowed" disabled>
            Merge PDFs
        </button>

        <p id="statusText" class="mt-4 text-sm text-gray-600"></p>
    </div>

    <!-- Link to our logic -->
    <script src="js/merge.js"></script>
</body>
</html>
